<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GymNote{% endblock %}</title>
</head>
<body>
    <header>
        <strong><a href="{% url 'core:calendar' %}">GymNote</a></strong>
        {% if user.is_authenticated %}
            | <a href="{% url 'core:calendar' %}">Calendário</a>
            | <a href="{% url 'accounts:profile' %}">Perfil</a>
            | {{ user.username }}
            | <form method="post" action="{% url 'accounts:logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            | <a href="{% url 'accounts:login' %}">Login</a>
            | <a href="{% url 'accounts:register' %}">Cadastro</a>
        {% endif %}
    </header>

    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
