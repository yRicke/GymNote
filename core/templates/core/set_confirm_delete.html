{% extends "base.html" %}

{% block title %}Excluir série | GymNote{% endblock %}

{% block content %}
<p>
    <a href="{% url 'core:workout_exercise' date_str=exercise_set.workout_exercise.workout_muscle_group.workout.date|date:'Y-m-d' pk=exercise_set.workout_exercise.pk %}">&larr; Voltar ao exercício</a>
</p>
<h1>Excluir série {{ exercise_set.order }}</h1>
<p>Confirma a exclusão desta série?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmar exclusão</button>
</form>
{% endblock %}
